<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#216EF7"/>
      <stop offset="55%" stop-color="#5B4CF5"/>
      <stop offset="100%" stop-color="#8B42EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#216EF7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#216EF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1A2B56" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#E5E9F2" stroke-width="1.5"/>

  <!-- Left Brand Column -->
  <g transform="translate(76, 82)">
    <!-- App Icon -->
    <rect x="0" y="0" width="76" height="76" rx="18" fill="url(#iconGrad)" filter="url(#cardShadow)"/>
    <g fill="#FFFFFF" opacity="0.96">
      <rect x="16" y="31" width="5" height="14" rx="2.5"/>
      <rect x="24" y="23" width="5" height="30" rx="2.5"/>
      <rect x="32" y="17" width="5" height="42" rx="2.5"/>
      <rect x="40" y="26" width="5" height="24" rx="2.5"/>
      <rect x="48" y="21" width="5" height="34" rx="2.5"/>
      <rect x="56" y="30" width="5" height="16" rx="2.5"/>
    </g>
    <!-- Sparkle -->
    <path d="M59 13 L61 18 L66 20 L61 22 L59 27 L57 22 L52 20 L57 18 Z" fill="#FFF3A6"/>

    <!-- Title -->
    <text x="96" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="44" font-weight="700" fill="#161924">Sonote</text>
    <text x="256" y="42" font-family="'PingFang SC', -apple-system, sans-serif" font-size="22" font-weight="500" fill="#7B8499">声记</text>
    <text x="96" y="70" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="500" fill="#216EF7">Native macOS AI Meeting Minutes · Apple Silicon MLX</text>

    <!-- Tagline -->
    <text x="0" y="128" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="21" font-weight="600" fill="#1F2433">100% 本地音频、降噪、声纹认人与智能纪要工作台</text>
    <text x="0" y="158" font-family="-apple-system, sans-serif" font-size="15.5" fill="#636D82">Dual-track capture · DeepFilterNet3 · Qwen3-ASR · ECAPA Voiceprints · Built-in MLX LLM</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 190)" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500">
      <rect x="0" y="0" width="132" height="32" rx="16" fill="#EBF2FF"/>
      <text x="66" y="20.5" text-anchor="middle" fill="#216EF7">SwiftUI Native</text>

      <rect x="142" y="0" width="144" height="32" rx="16" fill="#EDF9F4"/>
      <text x="214" y="20.5" text-anchor="middle" fill="#109A6E">Offline MLX GPU</text>

      <rect x="296" y="0" width="148" height="32" rx="16" fill="#F3F0FF"/>
      <text x="370" y="20.5" text-anchor="middle" fill="#635BFF">ECAPA Voiceprint</text>

      <rect x="454" y="0" width="166" height="32" rx="16" fill="#FFF4E8"/>
      <text x="537" y="20.5" text-anchor="middle" fill="#D97318">DeepSeek / Qwen / GPT</text>
    </g>
  </g>

  <!-- Right Minimalist Window Preview Mock -->
  <g transform="translate(756, 48)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="456" height="324" rx="16" fill="#FFFFFF" stroke="#E4E8F0" stroke-width="1.2"/>
    <!-- Left Transcript Pane -->
    <rect x="1" y="1" width="176" height="322" rx="15" fill="#FAFAFC"/>
    <line x1="177" y1="0" x2="177" y2="324" stroke="#EFF1F5" stroke-width="1.2"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="20" r="5" fill="#FF5F57"/>
    <circle cx="36" cy="20" r="5" fill="#FEBC2E"/>
    <circle cx="52" cy="20" r="5" fill="#28C840"/>

    <!-- Transcript lines -->
    <g transform="translate(18, 48)" font-family="-apple-system, 'PingFang SC', sans-serif">
      <text x="0" y="12" font-size="10.5" font-weight="600" fill="#216EF7">Alex · 00:12</text>
      <rect x="0" y="20" width="136" height="7" rx="3.5" fill="#E6EAF2"/>
      <rect x="0" y="33" width="108" height="7" rx="3.5" fill="#EEF1F6"/>

      <text x="0" y="64" font-size="10.5" font-weight="600" fill="#6E7789">林致远 · 00:28</text>
      <rect x="0" y="72" width="142" height="7" rx="3.5" fill="#E6EAF2"/>
      <rect x="0" y="85" width="124" height="7" rx="3.5" fill="#EEF1F6"/>
      <rect x="0" y="98" width="84" height="7" rx="3.5" fill="#EEF1F6"/>

      <text x="0" y="129" font-size="10.5" font-weight="600" fill="#216EF7">Alex · 00:46</text>
      <rect x="0" y="137" width="130" height="7" rx="3.5" fill="#E6EAF2"/>
      <rect x="0" y="150" width="96" height="7" rx="3.5" fill="#EEF1F6"/>
    </g>

    <!-- Waveform & Controls -->
    <g transform="translate(18, 250)">
      <g fill="#216EF7" opacity="0.65">
        <rect x="0" y="10" width="3" height="6" rx="1.5"/>
        <rect x="8" y="6" width="3" height="14" rx="1.5"/>
        <rect x="16" y="2" width="3" height="22" rx="1.5"/>
        <rect x="24" y="7" width="3" height="12" rx="1.5"/>
        <rect x="32" y="4" width="3" height="18" rx="1.5"/>
        <rect x="40" y="8" width="3" height="10" rx="1.5"/>
        <rect x="48" y="3" width="3" height="20" rx="1.5"/>
        <rect x="56" y="9" width="3" height="8" rx="1.5"/>
        <rect x="64" y="5" width="3" height="16" rx="1.5"/>
        <rect x="72" y="10" width="3" height="6" rx="1.5"/>
      </g>
      <rect x="0" y="34" width="64" height="24" rx="12" fill="#E9F2FF"/>
      <rect x="27" y="41" width="3.5" height="10" rx="1.5" fill="#216EF7"/>
      <rect x="33.5" y="41" width="3.5" height="10" rx="1.5" fill="#216EF7"/>

      <rect x="74" y="34" width="64" height="24" rx="12" fill="#F2F3F5"/>
      <rect x="101" y="41" width="10" height="10" rx="2" fill="#1A1C24"/>
    </g>

    <!-- Right Smart Minutes Pane -->
    <g transform="translate(198, 26)" font-family="-apple-system, 'PingFang SC', sans-serif">
      <text x="0" y="14" font-size="14" font-weight="700" fill="#161924">实时总结</text>
      <rect x="190" y="0" width="48" height="22" rx="7" fill="#F2F3F5"/>
      <rect x="193" y="3" width="21" height="16" rx="5" fill="#FFFFFF"/>

      <!-- Mind Map Nodes -->
      <rect x="0" y="36" width="118" height="28" rx="8" fill="#EEF4FE"/>
      <text x="12" y="54" font-size="11.5" font-weight="600" fill="#216EF7">v1.5 架构评审</text>

      <path d="M18 64 L18 164 M18 90 Q18 96 28 96 L38 96 M18 136 Q18 142 28 142 L38 142" stroke="#D5E3FC" stroke-width="1.6" fill="none"/>

      <rect x="38" y="80" width="198" height="32" rx="8" fill="#F4F8FF"/>
      <text x="50" y="100" font-size="11" fill="#2B3245">本地 MLX 降噪与声纹认人</text>

      <rect x="38" y="126" width="198" height="32" rx="8" fill="#F4F8FF"/>
      <text x="50" y="146" font-size="11" fill="#2B3245">支持 DeepSeek / Qwen / 飞书卡片</text>

      <!-- Action Items Card -->
      <rect x="0" y="182" width="236" height="92" rx="10" fill="#F8F9FB" stroke="#ECEEF3"/>
      <text x="14" y="203" font-size="11" font-weight="600" fill="#1A1C24">待办清单 · Action Items</text>
      <rect x="14" y="216" width="11" height="11" rx="3" fill="#216EF7"/>
      <path d="M16.5 221.5 L18.8 223.8 L22.5 219.2" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="32" y="225.5" font-size="10.5" fill="#4E5969">发布 GitHub v1.5.1 DMG 安装包</text>
      <rect x="14" y="240" width="11" height="11" rx="3" fill="none" stroke="#B8C0CF" stroke-width="1.4"/>
      <text x="32" y="249.5" font-size="10.5" fill="#4E5969">一键同步待办至 Apple 提醒事项</text>
    </g>
  </g>
</svg>
