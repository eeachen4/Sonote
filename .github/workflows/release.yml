name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-dmg:
    name: Build & Publish macOS arm64 DMG
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Ensure Metal Toolchain
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme Sonote-Package \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath .build/xcode-release

      - name: Build Signed App & Package DMG
        env:
          SIGN_IDENTITY: "-"
        run: |
          chmod +x scripts/build_app.sh scripts/package_dmg.sh
          ./scripts/build_app.sh
          ./scripts/package_dmg.sh
          cd dist
          shasum -a 256 Sonote-*-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Sonote-*-arm64.dmg
            dist/SHA256SUMS.txt
