name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-dmg:
    name: Build & Publish macOS arm64 DMG
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Ensure Metal Toolchain
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme Sonote-Package \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath .build/xcode-release

      - name: Import Apple Developer ID Certificate (Optional)
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${CERT_BASE64}" ]]; then
            echo "No Developer ID certificate configured; proceeding with self-signed build."
            exit 0
          fi
          KC_PASS="${KEYCHAIN_PASSWORD:-sonote-ci-keychain}"
          KEYCHAIN_PATH="$RUNNER_TEMP/sonote-signing.keychain-db"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build Signed App & Package DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          export SIGN_IDENTITY="${MACOS_SIGN_IDENTITY:--}"
          chmod +x scripts/build_app.sh scripts/package_dmg.sh
          ./scripts/build_app.sh
          ./scripts/package_dmg.sh

      - name: Notarize & Staple DMG (Optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [[ -z "${APPLE_ID}" || -z "${TEAM_ID}" || -z "${APP_PASSWORD}" ]]; then
            echo "Apple notarization credentials not configured; skipping notarization."
            exit 0
          fi
          DMG_PATH=$(ls dist/Sonote-*-arm64.dmg | head -n 1)
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          shasum -a 256 Sonote-*-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Sonote-*-arm64.dmg
            dist/SHA256SUMS.txt
