name: Feature Request / 功能建议
description: Suggest an enhancement or new integration / 提出新功能或体验改进建议
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点 / Problem or Use Case
      description: 描述你希望解决的会议记录或协作场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed Solution
      description: 简述你理想中的交互或功能形态。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 补充参考 / Additional Context
      description: 可附上竞品参考、设计思路或你是否愿意提交 PR。
